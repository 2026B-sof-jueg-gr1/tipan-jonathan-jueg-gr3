name: Publicar juego y landing

# Cada push a main compila, prueba, publica en GitHub Pages y sube el build a itch.io.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compila el juego, ejecuta las pruebas y publica el sitio completo
  #    (landing en la raíz + juego en /count-masters/) en la rama gh-pages.
  # ---------------------------------------------------------------------------
  publicar-pages:
    name: Compilar y publicar en GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: count-masters/package-lock.json

      - name: Instalar dependencias
        working-directory: count-masters
        run: npm ci

      # Si una prueba falla, el despliegue se detiene: nunca se publica roto.
      - name: Ejecutar pruebas
        working-directory: count-masters
        run: npm test

      - name: Compilar el juego
        working-directory: count-masters
        run: npm run build

      - name: Ensamblar el sitio publicado
        run: |
          mkdir -p sitio/count-masters
          cp index.html sitio/index.html
          cp -r count-masters/dist/. sitio/count-masters/
          touch sitio/.nojekyll
          echo "Contenido publicado:"
          find sitio -maxdepth 2 -type f | sort

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sitio
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Despliegue automático desde ${{ github.sha }}'

  # ---------------------------------------------------------------------------
  # 2. Sube el mismo build a itch.io con Butler.
  #    Requiere el secret BUTLER_API_KEY y las variables ITCH_USER / ITCH_GAME.
  #    Si el secret no existe, este trabajo se salta sin romper el pipeline.
  # ---------------------------------------------------------------------------
  publicar-itch:
    name: Publicar en itch.io con Butler
    runs-on: ubuntu-latest
    needs: publicar-pages
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: count-masters/package-lock.json

      - name: Instalar dependencias
        working-directory: count-masters
        run: npm ci

      - name: Compilar el juego
        working-directory: count-masters
        run: npm run build

      - name: Instalar Butler
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -oq butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Subir el canal html5
        if: env.BUTLER_API_KEY != ''
        run: |
          ./butler/butler push count-masters/dist \
            "$ITCH_USER/$ITCH_GAME:html5" \
            --userversion "${{ github.run_number }}"

      - name: Aviso si Butler no está configurado
        if: env.BUTLER_API_KEY == ''
        run: |
          echo "BUTLER_API_KEY no está definido: se omite la publicación en itch.io."
          echo "Añádelo en Settings > Secrets and variables > Actions."
